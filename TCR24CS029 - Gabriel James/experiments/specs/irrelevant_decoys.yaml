# Experiment 4 input: capabilities unrelated to the hospital, e-commerce, document and
# compliance goals of the corpus. The ranking experiment adds these 24 decoys to the 53
# corpus capabilities and measures whether the representation keeps them away from the
# intended mappings. Three of them share a token with a requirement on purpose
# (register_employee, award_loyalty_points, summarize_customer_feedback): they are the
# hardest irrelevant capabilities and the experiment reports their measured ceiling
# instead of only showing easy cases. The sheet exercises all nine mechanism kinds.
spec_version: "1.0"

module:
  module_id: experiment-irrelevant-decoys
  version: "1.0"
  domain: generic
  port: 5302
  base_url: "http://127.0.0.1:5302"
  health: /health
  description: Twenty four capabilities from unrelated domains used as distractor pool.
  language: specification

