<!doctype html>
<html lang="en">
<head>

  <title>{% block title %}Patient Registry (Alt){% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('ui.static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('ui.home') }}">CareWeave &middot; Registry (Alt)</a>
    <nav>
      <a href="{{ url_for('ui.patients') }}">Patients</a>

  <script src="{{ url_for('ui.static', filename='app.js') }}"></script>

</html>
