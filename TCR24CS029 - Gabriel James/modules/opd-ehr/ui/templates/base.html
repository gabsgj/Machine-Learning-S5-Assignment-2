<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Outpatient EHR{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('ui.static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('ui.home') }}">CareWeave &middot; Outpatient EHR</a>
    <nav>
      <a href="{{ url_for('ui.encounters') }}">Encounters</a>
      <a href="{{ url_for('ui.encounter_new') }}">New encounter</a>
      <a href="{{ url_for('ui.capabilities') }}">Capabilities</a>
      <a href="/health">Health</a>
      <a href="/spec">Spec</a>
      <a href="/state">State</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Port 5003 &middot; served offline, no external assets</footer>
  <script src="{{ url_for('ui.static', filename='app.js') }}"></script>
</body>
</html>
